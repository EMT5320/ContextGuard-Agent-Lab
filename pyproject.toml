[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextguard-agent-lab"
version = "0.1.0"
description = "MCP-native, evidence-governed agent evaluation workbench."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ContextGuard Agent Lab" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["fastmcp>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
